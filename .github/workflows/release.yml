name: Signed Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package-and-sign:
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check tag matches app version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          if ("v$($manifest.version)" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match package.json version $($manifest.version)."
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win
      - name: Check SignPath release configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_RELEASE_POLICY_SLUG: ${{ vars.SIGNPATH_RELEASE_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_EXPECTED_SIGNER_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SIGNER_SUBJECT }}
        run: |
          $required = @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_RELEASE_POLICY_SLUG",
            "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG",
            "SIGNPATH_EXPECTED_SIGNER_SUBJECT"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) { throw "SignPath is enabled but required configuration is missing: $($missing -join ', ')." }
      - name: Verify portable product metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $portable = @(Get-ChildItem -LiteralPath "release" -Filter "SSF-Companion-*-portable.exe")
          if ($portable.Count -ne 1) { throw "Expected exactly one portable Windows executable." }
          if ($portable[0].VersionInfo.ProductName -cne $manifest.build.productName) { throw "Portable executable product metadata does not match the app name." }
          if ($portable[0].VersionInfo.ProductVersion -cne $manifest.version) { throw "Portable executable version metadata does not match package.json." }
          if ("v$($manifest.version)" -cne $env:RELEASE_TAG) { throw "Portable executable metadata does not match the release tag." }
      - name: Upload unsigned build for controlled signing
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: ssf-companion-unsigned-${{ github.ref_name }}
          path: release/SSF-Companion-*-portable.exe
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Request signed artifact
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_RELEASE_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: ${{ runner.temp }}/signed
      - name: Verify Authenticode signature
        shell: pwsh
        env:
          EXPECTED_SIGNER_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SIGNER_SUBJECT }}
        run: |
          $signedFiles = @(Get-ChildItem "${{ runner.temp }}/signed" -Filter "*.exe")
          if ($signedFiles.Count -ne 1) { throw "SignPath must return exactly one portable executable." }
          $signed = $signedFiles[0]
          $signature = Get-AuthenticodeSignature -FilePath $signed.FullName
          if ($signature.Status -ne "Valid") { throw "Executable signature is not valid: $($signature.StatusMessage)" }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER_SUBJECT)) { throw "SIGNPATH_EXPECTED_SIGNER_SUBJECT is not configured." }
          if ($signature.SignerCertificate.Subject -cne $env:EXPECTED_SIGNER_SUBJECT) { throw "Executable signer does not match the configured SignPath publisher." }
          Write-Host "Verified configured signer: $($signature.SignerCertificate.Subject)"
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $signed = Get-ChildItem "${{ runner.temp }}/signed" -Filter "*.exe"
          $lines = $signed | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          }
          Set-Content -LiteralPath "${{ runner.temp }}/signed/SHA256SUMS.txt" -Value $lines -Encoding ascii
      - name: Upload signed release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ssf-companion-signed-${{ github.ref_name }}
          path: ${{ runner.temp }}/signed/*
          if-no-files-found: error

  publish:
    needs: package-and-sign
    if: vars.SIGNPATH_ENABLED == 'true' && needs.package-and-sign.result == 'success'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ssf-companion-signed-${{ github.ref_name }}
          path: signed
      - name: Confirm signed asset exists
        shell: pwsh
        env:
          EXPECTED_SIGNER_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SIGNER_SUBJECT }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem signed -Filter "*.exe")
          if ($assets.Count -ne 1) { throw "Expected exactly one signed portable executable." }
          $asset = $assets[0]
          $signature = Get-AuthenticodeSignature -FilePath $asset.FullName
          if ($signature.Status -ne "Valid") { throw "Refusing to publish an unsigned or invalid executable." }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER_SUBJECT) -or $signature.SignerCertificate.Subject -cne $env:EXPECTED_SIGNER_SUBJECT) { throw "Refusing to publish an executable with an unexpected signer." }
          $expectedVersion = $env:RELEASE_TAG -replace "^v", ""
          if ($asset.VersionInfo.ProductName -cne "SSF Companion" -or $asset.VersionInfo.ProductVersion -cne $expectedVersion) { throw "Signed executable metadata does not match the tagged product version." }
          $expected = (Get-Content signed/SHA256SUMS.txt -Raw).Trim().Split(' ')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Release executable does not match its published SHA-256 checksum." }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            signed/*.exe
            signed/SHA256SUMS.txt
